

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYVO LIVE</title>
<style>
body{margin:0;background:#101020;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:24px;background:#20183b}
h1{color:#c4b5fd}
main{max-width:500px;margin:auto;padding:16px}
.card{background:#211f3b;padding:18px;margin:14px 0;border-radius:15px}
input{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;border:0}
button{padding:13px;margin:5px;border:0;border-radius:9px;background:#8b5cf6;color:white;font-weight:bold}
.wide{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{min-height:65px}
</style>
</head>
<body>
<header>
<h1>ROYVO LIVE</h1>
<p>Connect • Chat • Go Live</p>
</header>
<main>
<section class="card">
<h2>Create Your Profile</h2>
<input id="name" placeholder="Your name">
<input id="email" type="email" placeholder="Your email">
<button class="wide" onclick="signup()">Continue</button>
<p id="status">Welcome to ROYVO LIVE!</p>
</section>
<section class="card">
<h2>Your Profile</h2>
<p id="profile">Guest</p>
</section>
<section class="card">
<h2>Explore</h2>
<div class="grid">
<button onclick="show('Live Video')">📹 Live Video</button>
<button onclick="show('Video Call')">🤳 Video Call</button>
<button onclick="show('Audio Call')">🎙️ Audio Call</button>
<button onclick="show('Chat')">💬 Chat</button>
<button onclick="show('Gifts')">🎁 Gifts</button>
<button onclick="show('Coins')">🪙 Coins</button>
</div>
<p id="feature">Choose a feature above.</p>
</section>
</main>
<script>
function signup(){
let n=document.getElementById('name').value.trim();
let e=document.getElementById('email').value.trim();
if(!n||!e){document.getElementById('status').textContent='Enter your name and email.';return;}
document.getElementById('profile').textContent=n;
document.getElementById('status').textContent='Demo profile created. Real login is not connected yet.';
}
function show(f){
document.getElementById('feature').textContent=f+' selected. Online services need to be connected next.';
}
</script>
</body>
</html>
