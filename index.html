
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYVO LIVE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101020;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 22px;
  background: #20183b;
}

h1 { color: #c4b5fd; }

main {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

.card {
  background: #211f3b;
  padding: 18px;
  margin: 14px 0;
  border-radius: 15px;
}

input {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border-radius: 8px;
  border: 0;
}

button {
  padding: 13px;
  margin: 5px 0;
  border: 0;
  border-radius: 9px;
  background: #8b5cf6;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.wide { width: 100%; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.grid button { min-height: 60px; }

video {
  width: 100%;
  background: black;
  border-radius: 12px;
  margin-top: 10px;
}

#status, #cameraStatus {
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<header>
  <h1>ROYVO LIVE</h1>
  <p>Connect • Chat • Go Live</p>
</header>

<main>

<section class="card">
  <h2>Create Your Profile</h2>
  <input id="name" placeholder="Your name">
  <input id="email" type="email" placeholder="Your email">
  <button class="wide" id="profileBtn">Continue</button>
  <p id="status">Welcome to ROYVO LIVE!</p>
</section>

<section class="card">
  <h2>Your Profile</h2>
  <p id="profile">Guest</p>
  <p id="authStatus">Checking Firebase...</p>
</section>

<section class="card">
  <h2>Explore</h2>

  <div class="grid">
    <button data-feature="Live Video">📹 Live Video</button>
    <button data-feature="Video Call">🤳 Video Call</button>
    <button data-feature="Audio Call">🎙️ Audio Call</button>
    <button data-feature="Chat">💬 Chat</button>
    <button data-feature="Gifts">🎁 Gifts</button>
    <button data-feature="Coins">🪙 Coins</button>
  </div>

  <div id="feature">
    Choose a feature above.
  </div>
</section>

</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCQ2OYGMyaTMj96SNln-3mGunKjTmoGDM0",
  authDomain: "royvo-live-d37de.firebaseapp.com",
  projectId: "royvo-live-d37de",
  storageBucket: "royvo-live-d37de.firebasestorage.app",
  messagingSenderId: "828251158722",
  appId: "1:828251158722:web:c6605c8ce17dddee04635b",
  measurementId: "G-LJVY4JLJNS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

let cameraStream = null;

onAuthStateChanged(auth, user => {
  $("authStatus").textContent = user
    ? "Firebase connected. User session active."
    : "Firebase ready. Sign-in not active.";
});

$("profileBtn").addEventListener("click", () => {
  const name = $("name").value.trim();
  const email = $("email").value.trim();

  if (!name || !email) {
    $("status").textContent = "Enter your name and email.";
    return;
  }

  $("profile").textContent = name;
  $("status").textContent =
    "Demo profile created. Email login is not connected.";
});

document.querySelectorAll("[data-feature]").forEach(button => {
  button.addEventListener("click", async () => {
    const feature = button.dataset.feature;

    await stopCamera();

    if (feature === "Live Video") {
      $("feature").innerHTML = `
        <h3>📹 ROYVO LIVE Studio</h3>
        <video id="livePreview" autoplay muted playsinline></video>
        <p id="cameraStatus">Waiting for camera permission...</p>
        <button id="stopCamera">⏹ Stop Camera</button>
        <p>Preview only: public streaming is not connected yet.</p>
      `;

      $("stopCamera").addEventListener("click", stopCamera);

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Camera needs HTTPS. Open the published website."
          );
        }

        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });

        const preview = $("livePreview");

        if (preview) {
          preview.srcObject = cameraStream;
          $("cameraStatus").textContent =
            "Camera is ON. Your preview is working.";
        } else {
          await stopCamera();
        }

      } catch (error) {
        $("cameraStatus").textContent =
          "Camera error: " + error.message +
          ". Check browser camera and microphone permissions.";
      }

    } else {
      $("feature").textContent =
        feature + " selected. Online services need to be connected next.";
    }
  });
});

async function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  const preview = $("livePreview");
  if (preview) preview.srcObject = null;
}
</script>

</body>
</html>
